[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-bench"
version = "0.2.0"
description = "A modular, reproducible benchmarking platform for differentially private algorithms (step 2: classic DP queries on databases)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "plotly>=5.18",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.45"]
dev = ["pytest>=8.0", "ruff>=0.5", "streamlit>=1.45"]

[project.scripts]
dpbench = "dpbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Code width is enforced by `ruff format`; long strings and docstrings are allowed.
ignore = ["B008", "B905", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["dpbench"]
